<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Авторизация на сайт</title>
  <link rel="stylesheet" href="styles/stylesAuth.css">
</head>
<body>
<main>
  <div class="wrapper-auth">
    <div class="container-auth">
      <h1 style="text-align: center">Регистрация</h1>
      <form method="post" class="form-style">
        <input type="email" name="email" id="email" placeholder="Email" class="input-style" value="">
        <input type="password" name="password" id="password" placeholder="Пароль" class="input-style" value="">
        <button type="submit" class="btn" style="margin-left: 3vw">Зарегистрироваться</button>
        <a href="auth.html" class="choice-auth">Войти</a>
      </form>
    </div>
  </div>
</main>
</body>
</html>
